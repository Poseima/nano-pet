name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild -project "Nano Pet.xcodeproj" \
            -scheme "Nano Pet" \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          mkdir dmg_contents
          cp -R "build/Build/Products/Release/Nano Pet.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Nano Pet" -srcfolder dmg_contents -ov -format UDZO "Nano.Pet.${VERSION}.dmg"
          rm -rf dmg_contents

          ls -lh *.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Nano.Pet.*.dmg
          generate_release_notes: true
          body: |
            ## Download

            Download the DMG file below, open it, and drag **Nano Pet** to your Applications folder.

            > **Note:** On first launch, right-click and select "Open" to bypass Gatekeeper.
